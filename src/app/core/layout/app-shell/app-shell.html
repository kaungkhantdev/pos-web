<!-- Phones only -->
<header class="app-mobilebar">
  <button #toggle type="button" class="mb-btn" aria-label="Open menu"
          aria-controls="sidebar" [attr.aria-expanded]="menuOpen()" (click)="setMenu(!menuOpen())">
    <i class="hgi-stroke hgi-menu-01 text-xl leading-none"></i>
  </button>
  <a routerLink="/dashboard" class="mb-brand" aria-label="Astronity home">
    <app-logo [width]="26" />
    <span>Astronity</span>
  </a>
  <span class="rail-avatar" title="Somchai K. · Manager" aria-label="Signed in as Somchai K." role="img">SK</span>
</header>

<div class="app-body">
  <aside #rail id="sidebar" class="app-rail" [class.open]="menuOpen()" [class.expanded]="expanded()"
         aria-label="Main">
    <div class="rail-user" title="Somchai K. · Manager">
      <span class="rail-avatar" aria-hidden="true">SK</span>
      <span class="rail-user-name">Somchai K.<small>Manager</small></span>
    </div>

    <!-- Desktop only: show / hide the names -->
    <button type="button" class="sb-item rail-toggle" aria-controls="sidebar"
            [attr.aria-expanded]="expanded()" [attr.aria-label]="toggleLabel()"
            [attr.data-tip]="toggleLabel()" (click)="toggleExpanded()">
      <span class="sb-icon"><i class="hgi-stroke hgi-arrow-right-double text-[18px] leading-none"></i></span>
      <span class="sb-label">{{ toggleLabel() }}</span>
    </button>

    <nav class="rail-group">
      @for (item of nav; track item.link) {
        <ng-container [ngTemplateOutlet]="navLink" [ngTemplateOutletContext]="{ $implicit: item }" />
      }
    </nav>

    <div class="rail-group rail-bottom">
      @for (item of bottomNav; track item.link) {
        <ng-container [ngTemplateOutlet]="navLink" [ngTemplateOutletContext]="{ $implicit: item }" />
      }
      <button type="button" class="sb-item" data-tip="Logout" (click)="logout()">
        <span class="sb-icon"><i class="hgi-stroke hgi-logout-02 text-[18px] leading-none"></i></span>
        <span class="sb-label">Logout</span>
      </button>
    </div>

    <a routerLink="/dashboard" class="rail-logo" aria-label="Astronity home">
      <app-logo [width]="26" />
    </a>
  </aside>

  <main [class]="fullHeight()
      ? 'flex-1 flex flex-col min-w-0 overflow-hidden'
      : 'flex-1 min-w-0 overflow-y-auto'">
    <router-outlet />
  </main>
</div>

<div id="sbBackdrop" [class.show]="menuOpen()" (click)="setMenu(false)"></div>

<ng-template #navLink let-item>
  <a [routerLink]="item.link" routerLinkActive="active" ariaCurrentWhenActive="page"
     class="sb-item" [attr.data-tip]="item.label">
    <span class="sb-icon">
      @if (item.icon) {
        <i class="hgi-stroke {{ item.icon }} text-[18px] leading-none"></i>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          @for (d of item.svg; track d) { <path [attr.d]="d" /> }
        </svg>
      }
    </span>
    <span class="sb-label">{{ item.label }}</span>
  </a>
</ng-template>
