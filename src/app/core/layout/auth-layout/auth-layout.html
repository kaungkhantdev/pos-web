<div class="min-h-screen flex">

  <!-- LEFT: branding (desktop) -->
  <aside class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-[linear-gradient(160deg,#00c066_0%,#007a3f_55%,#006b37_100%)]">
    <div class="absolute inset-0 opacity-10" aria-hidden="true">
      <div class="absolute top-20 left-20 w-40 h-40 border-4 border-white rounded-full"></div>
      <div class="absolute top-40 right-20 w-60 h-60 border-4 border-white rounded-full"></div>
      <div class="absolute bottom-20 left-40 w-32 h-32 border-4 border-white rounded-full"></div>
      <div class="absolute bottom-40 right-40 w-24 h-24 border-4 border-white rounded-full"></div>
    </div>

    <div class="relative z-10 flex flex-col justify-center px-16 text-white">
      <div class="mb-12">
        <div class="mb-6">
          <span class="w-14 h-14 rounded-full bg-white flex items-center justify-center ring-4 ring-white/25">
            <app-logo [width]="30" />
          </span>
        </div>
        <p class="text-4xl font-semibold mb-2">Astronity POS</p>
        <p class="text-lg text-white/80">Point of Sale System</p>
      </div>

      <ul class="flex flex-col gap-6">
        @for (f of features; track f.title) {
          <li class="flex items-start gap-4">
            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center shrink-0">
              <i class="hgi-stroke {{ f.icon }} text-2xl" aria-hidden="true"></i>
            </div>
            <div>
              <p class="font-semibold text-lg">{{ f.title }}</p>
              <p class="text-sm text-white/70">{{ f.text }}</p>
            </div>
          </li>
        }
      </ul>
    </div>
  </aside>

  <!-- RIGHT: page card -->
  <main class="flex-1 min-w-0 flex items-center justify-center px-4 py-8 sm:p-8">
    <div class="w-full max-w-md">

      <div class="lg:hidden text-center mb-8">
        <div class="flex justify-center mb-4">
          <span class="w-14 h-14 rounded-full border-[1.5px] border-gray-200 bg-white flex items-center justify-center shrink-0">
            <app-logo [width]="30" />
          </span>
        </div>
        <p class="text-2xl font-semibold text-gray-900">Astronity POS</p>
      </div>

      <router-outlet />

      <p class="text-center text-xs text-gray-400 mt-4">
        &copy; {{ year }} Astronity. All rights reserved.
      </p>
    </div>
  </main>
</div>
