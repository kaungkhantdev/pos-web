<svg viewBox="0 0 1000 265" class="w-full" role="img" [attr.aria-label]="label()">
  <defs>
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c066" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00c066" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g stroke="#f3f4f6" stroke-width="1">
    @for (y of gridY; track y) {
      <line x1="60" [attr.y1]="y" x2="990" [attr.y2]="y" />
    }
  </g>
  <g fill="#9ca3af" font-size="11" text-anchor="end">
    @for (t of yLabels(); track t.y) {
      <text x="48" [attr.y]="t.y">{{ t.text }}</text>
    }
  </g>
  <g font-size="11" text-anchor="middle">
    @for (x of xLabels(); track $index) {
      <text
        [attr.x]="x.x"
        y="245"
        [attr.fill]="x.peak ? '#111827' : '#9ca3af'"
        [attr.font-weight]="x.peak ? 600 : null"
      >
        {{ x.text }}
      </text>
    }
  </g>
  @if (points().length > 1) {
    <path fill="url(#trendFill)" [attr.d]="area()" />
    <path
      fill="none"
      stroke="#00c066"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      [attr.d]="line()"
    />
    <line
      [attr.x1]="peak().x"
      [attr.y1]="peak().y"
      [attr.x2]="peak().x"
      y2="220"
      stroke="#00c066"
      stroke-width="1"
      stroke-dasharray="3 4"
      opacity="0.6"
    />
    <circle
      [attr.cx]="peak().x"
      [attr.cy]="peak().y"
      r="5"
      fill="#00c066"
      stroke="#fff"
      stroke-width="2.5"
    />
    <rect
      [attr.x]="peak().tipX - peak().tipW / 2"
      [attr.y]="peak().tipY"
      [attr.width]="peak().tipW"
      height="26"
      rx="7"
      fill="#1b1b1d"
    />
    <text
      [attr.x]="peak().tipX"
      [attr.y]="peak().tipY + 17"
      fill="#fff"
      font-size="12"
      font-weight="600"
      text-anchor="middle"
    >
      {{ peak().text }}
    </text>
  }
</svg>
